<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OpenSphere Vue</title>
    <style>
      :root { color-scheme: dark; }
      html, body, #app { width: 100%; height: 100%; margin: 0; }
      body { min-width: 320px; background: #0a1119; }
      .atlas-boot-shell { box-sizing: border-box; display: grid; min-height: 100%; place-items: center; padding: 24px; color: #d8e1ec; background: radial-gradient(circle at 50% 42%, rgb(36 71 96 / 48%), transparent 38%), #0a1119; font-family: Inter, "PingFang SC", "Microsoft YaHei", sans-serif; }
      .atlas-boot-shell__panel { display: flex; align-items: center; gap: 14px; min-width: 224px; }
      .atlas-boot-shell__mark { position: relative; width: 28px; height: 28px; border: 1px solid rgb(118 183 231 / 56%); border-radius: 6px; }
      .atlas-boot-shell__mark::before, .atlas-boot-shell__mark::after { position: absolute; content: ""; background: #76b7e7; }
      .atlas-boot-shell__mark::before { top: 6px; right: 6px; width: 7px; height: 7px; border-radius: 50%; box-shadow: -9px 8px 0 -2px #76b7e7; }
      .atlas-boot-shell__mark::after { right: 5px; bottom: 5px; left: 5px; height: 1px; opacity: .7; }
      .atlas-boot-shell__copy { display: grid; gap: 4px; }
      .atlas-boot-shell__copy strong { color: #f0f5fa; font-size: 14px; font-weight: 600; letter-spacing: .06em; }
      .atlas-boot-shell__copy span { color: #98aabb; font-size: 12px; letter-spacing: .04em; }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="atlas-boot-shell" role="status" aria-live="polite" aria-label="正在启动地图工作区">
        <div class="atlas-boot-shell__panel">
          <span class="atlas-boot-shell__mark" aria-hidden="true"></span>
          <div class="atlas-boot-shell__copy">
            <strong>OpenSphere</strong>
            <span>正在准备地图工作区</span>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
